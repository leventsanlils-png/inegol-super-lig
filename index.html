<style>
:root{--navy:#0F1E3D;--navy2:#1C2F57;--acc:#F5B301;--bg:#F3F5FA;--line:#DCE2EE;--muted:#4A5672;--ok:#0B5B36}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 10px) 6px calc(env(safe-area-inset-left) + 6px);display:flex;align-items:center;gap:6px}
.bar a{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;min-height:44px;min-width:44px;padding:0 10px;border-radius:10px}
.bar a:active{background:var(--navy2)}
.bar .t{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bulut{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--navy2);color:#fff;white-space:nowrap;flex:none}
.bulut i{width:8px;height:8px;border-radius:50%;background:#F5B301;flex:none}
.msg.ro{background:#EAF0FF;color:#1D3A7A;font-weight:600;line-height:1.5}
.bas-rozet{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;background:var(--acc);color:var(--navy);font-weight:900;padding:0 20px;min-height:52px;border-radius:999px;text-decoration:none;box-shadow:0 10px 28px rgba(0,0,0,.35);display:flex;align-items:center}
.home-foot .bulut{color:#C3CDE3;font-weight:600}
main.page{max-width:1100px;margin:0 auto;padding:18px calc(env(safe-area-inset-right) + 16px) calc(48px + env(safe-area-inset-bottom)) calc(env(safe-area-inset-left) + 16px)}
h1{font-size:clamp(26px,6.5vw,40px);margin:4px 0 6px;font-weight:900;line-height:1.1}
.sub{color:var(--muted);margin:0 0 18px;font-size:16px;line-height:1.5}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #B9C3D6;border-radius:10px;background:#fff;font-weight:500;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,#4A5672 50%),linear-gradient(135deg,#4A5672 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.field select:disabled{background-color:#F3F5FA;color:#4A5672}
.field textarea{min-height:110px;resize:vertical}
.full{grid-column:1/-1}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid #B9C3D6;background:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;color:var(--navy);font-size:15px}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.a{background:var(--acc);border-color:var(--acc);color:var(--navy)}
.btn.w{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn.del{border-color:#F1B5AE;color:#8A1C12}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.tehlike{background:#B42318;border-color:#B42318;color:#fff}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,26,74,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.modal-k{background:#fff;border-radius:18px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-k p{margin:0;font-size:17px;line-height:1.5;font-weight:600}
@media (min-width:600px){.modal{align-items:center}}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:14px;max-width:100%}
.tab{flex:1;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:transparent;font-weight:800;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:900;line-height:1.2}
.stat span{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.stat.d{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat.d span{color:var(--acc)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid #E6EAF2;white-space:nowrap}
thead th{background:#F7F8FC;border-top:0;font-size:13px}
td.c,th.c{text-align:center}
tr.lead td{background:#FFF8E1}
.empty{border:1px dashed #B9C3D6;border-radius:14px;padding:24px;text-align:center;color:var(--muted);background:#fff;line-height:1.6}
.msg{padding:12px 16px;border-radius:12px;font-weight:700}
.msg.ok{background:#E3F6EC;color:var(--ok)}
.msg.err{background:#FDE7E5;color:#8A1C12}
.h2{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin:6px 0 0}
.h3{font-size:19px;font-weight:900;margin:0}
.okl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.okl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:#F7F8FC;border:1px solid #E6EAF2;font-weight:600;font-size:15px;line-height:1.3}
.okl li.on{background:#FFF8E1;border-color:var(--acc)}
.okl li .btn{flex:none}
.okl li.on .btn{background:var(--navy);color:#fff;border-color:var(--navy)}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 8px;border-radius:8px;font-weight:500;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--navy);flex:none}
.scroll{max-height:420px;overflow-y:auto;border:1px solid #E6EAF2;border-radius:12px;padding:4px;-webkit-overflow-scrolling:touch}
.info{background:#F3F5FA;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;color:#2D3854}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.grp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp-h{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.grp-h .row{gap:10px}
.grp-h small{color:#C3CDE3;font-weight:600;font-size:13px}
.harf{width:40px;height:40px;border-radius:10px;background:var(--acc);color:var(--navy);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.grp-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.grp ol{margin:0;padding:12px 16px 12px 36px;border-bottom:1px solid #E6EAF2;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.tur{display:flex;flex-direction:column;gap:6px}
.tur-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em}
.mac{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;background:#F7F8FC;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;line-height:1.25}
.mac .r{text-align:right}
.vs{font-size:11px;font-weight:900;color:#6B4A00;background:#FFF4D1;padding:3px 8px;border-radius:999px}
.skor{display:flex;align-items:center;gap:4px}
.skor input{width:50px;min-height:44px;text-align:center;border:1px solid #B9C3D6;border-radius:8px;font-weight:800;background:#fff;padding:0}
.bay{font-size:13px;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.lc{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--navy);font-weight:800;font-size:17px;min-height:76px}
.lc:active{background:#F7F8FC}
.lc .ic{width:44px;height:44px;border-radius:12px;background:var(--navy);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.lc small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.duy{display:flex;flex-direction:column;gap:6px}
.duy .row{align-items:flex-start;flex-wrap:nowrap}
.duy p{margin:0;line-height:1.55;white-space:pre-wrap}
.duy time{font-size:13px;color:var(--muted);font-weight:700}
.rules h2{font-size:18px;margin:0 0 6px}
.rules p,.rules li{line-height:1.6;margin:0}
.rules ul{margin:0;padding-left:20px}
.okd{padding:0}
.okd summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.okd summary::-webkit-details-marker{display:none}
.okd summary b{font-size:18px}
.okd summary small{display:block;color:#4A5672;font-size:13px;margin-top:2px}
.okd summary::after{content:"";width:10px;height:10px;border-right:2.5px solid #4A5672;border-bottom:2.5px solid #4A5672;transform:rotate(45deg);flex:none;transition:transform .15s}
.okd[open] summary::after{transform:rotate(-135deg)}
.okd .okg{padding:0 18px 18px}
.okg{display:flex;flex-direction:column;gap:10px}
.okg li{margin-bottom:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,160%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .2s;z-index:50;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(15,30,61,.25);pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:#3DDC97}
.toast.err i{background:#FF8A80}
/* Ana ekran */
.home{background:#0A1A4A;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hero{position:relative;width:100%;max-width:1144px;margin:0 auto;aspect-ratio:1144/1375;container-type:inline-size}
.hero img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hs{position:absolute;display:block;border-radius:16px;transition:background .12s,box-shadow .12s}
.hs:hover,.hs:active{background:rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.hs:focus-visible{outline:3px solid #fff;outline-offset:2px}
.num{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;line-height:1;font-size:clamp(13px,3.4vw,40px);font-size:3.4cqw;text-shadow:0 2px 3px rgba(0,0,0,.35);border-radius:6px;pointer-events:none}
.logo-ust{position:absolute;left:2.2%;top:1.6%;width:15.5%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:18%;padding:1.1%;box-sizing:border-box;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:2;text-decoration:none}
.logo-ust img{width:100%;height:100%;object-fit:contain;display:block}
.logo-ust.bos{background:rgba(255,255,255,.85);border:2px dashed #0F1E3D;box-shadow:none;color:#0F1E3D;font-weight:800;text-align:center;line-height:1.15;font-size:clamp(10px,2vw,20px);font-size:1.8cqw}
.home-foot{max-width:1144px;margin:0 auto;padding:10px 16px 16px;color:#C3CDE3;font-size:13px;text-align:center}
.print-only{display:none}
@media print{
  .bar,.toast,.no-print{display:none!important}
  .print-only{display:block}
  body{background:#fff}
  main.page{padding:0;max-width:none}
  .tw{border:0;overflow:visible}
  th,td{white-space:normal;font-size:11px;padding:4px 6px;border:1px solid #ccc}
  .print-only h2{font-size:15px;margin:16px 0 6px;page-break-after:avoid}
}
</style>
</head>

/* ---------- Kura ve puan durumu ---------- */
function fikstur(okullar, baslangic, aralik) {
  var t = okullar.slice(); if (t.length % 2 === 1) t.push(null);

    var maclar = [], bay = '';

      var a = t[i], b = t[m - 1 - i];
      if (a && b) maclar.push(r % 2 === 0 ? { ev: a, dep: b } : { ev: b, dep: a }); else bay = a || b;
    }
    turlar.push({ no: r + 1, iso: tarihIso(baslangic, r * aralik), tarih: tarihMetin(baslangic, r * aralik), maclar: maclar, bay: bay });
    t = [t[0], t[m - 1]].concat(t.slice(1, m - 1));
  }
  return turlar;
}
function kuraCek(k) {

  var max = ayarSayi('maxGrup', 5, 2), aralik = ayarSayi('turAraligi', 15, 1);
  var g = Math.ceil(secilen.length / max), harfler = 'ABCDEFGHIJKLMNOPRSTUVYZ', gruplar = [];
  for (var a = 0; a < g; a++) gruplar.push([]);
  secilen.forEach(function (n, idx) { gruplar[idx % g].push(n); });
  D.kura.sonuc[k] = {
    baslangic: D.kura.baslangic, aralik: aralik, cekim: new Date().toISOString(),
    gruplar: gruplar.map(function (ok, idx) { return { harf: harfler[idx] || String(idx + 1), okullar: ok, turlar: fikstur(ok, D.kura.baslangic, aralik) }; })
  };
  return '';
}
function skorKey(k, harf, m) { return k + '|' + harf + '|' + m.ev + '|' + m.dep; }
function skorVar(s) { return s && s.e !== '' && s.d !== '' && s.e !== undefined && s.d !== undefined; }
function puanTablosu(k, g) {

  g.turlar.forEach(function (tur) {
    if (tur.bay && t[tur.bay] && turOynandi(k, g, tur)) { t[tur.bay].by++; t[tur.bay].p += P.bay; }
  });
  g.turlar.forEach(function (tur) { tur.maclar.forEach(function (m) {
    var s = D.skor[skorKey(k, g.harf, m)]; if (!skorVar(s)) return;
    var e = +s.e, d = +s.d, A = t[m.ev], B = t[m.dep]; if (!A || !B) return;

  }); });
